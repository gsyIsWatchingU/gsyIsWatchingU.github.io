<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>比奇堡邻里 · 3D 模型审查</title>
<link rel="stylesheet" href="./neighborhood.css?v=20261013-behavior-19" />
</head>
<body>
<div id="canvas-wrap">
  <div class="top-bar">
    <button id="btn-squidward" class="active">章鱼哥的人像屋</button>
    <button id="btn-patrick">派大星的石头屋</button>
    <button id="btn-exit" style="display:none">返回外部</button>
  </div>
  <button class="reset-btn" id="btn-reset">重置镜头</button>
  <div class="info-panel" id="info-panel">
    <h2 id="info-title">章鱼哥的人像屋</h2>
    <p id="info-desc">正在加载…</p>
    <div class="meta" id="info-meta"></div>
  </div>
  <div class="controls-hint">拖拽旋转 · 滚轮/双指缩放 · 点击门进入</div>
  <div class="room-chips" id="room-chips" hidden></div>
  <div class="resident-panel" id="resident-panel" hidden>
    <span id="resident-state">章鱼哥 · 发呆</span>
    <button data-resident-action="walk">走走</button><button data-resident-action="wave">招手</button><button data-resident-action="read">看夹板</button>
    <select id="resident-mood" aria-label="章鱼哥的心情"><option value="">切换心情</option><option value="idle">慵懒</option><option value="happy">开心</option><option value="annoyed">烦躁</option><option value="surprised">惊讶</option><option value="sad">难过</option></select>
    <button id="resident-pause">暂停活动</button>
    <a href="../../squidward-model.html" target="_blank" rel="noreferrer">动作近景</a>
  </div>
  <div class="loading" id="loading"><div class="spinner"></div><p>正在加载模型…</p></div>
  <div class="error-panel" id="error-panel" hidden>
    <h2>加载失败</h2>
    <p>模型资源未能载入，请检查网络后重试。</p>
    <button id="btn-retry">重试</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.186.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.186.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./neighborhood.js?v=20261013-behavior-19"></script>
</body>
</html>
