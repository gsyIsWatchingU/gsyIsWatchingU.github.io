<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>派大星石头屋 3D</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1b2a;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    background: rgba(0,0,0,0.3);
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header p { font-size: 13px; opacity: 0.6; margin-top: 4px; }
  model-viewer {
    flex: 1;
    width: 100%;
    --poster-color: transparent;
    background: linear-gradient(180deg, #1b2838 0%, #2a3f5f 60%, #c4b59a 100%);
  }
</style>
</head>
<body>
<header>
  <h1>派大星石头屋</h1>
  <p>Hunyuan3D 生成 · Blender 补骨头风向标 · 拖拽旋转 / 滚轮缩放</p>
</header>
<model-viewer
  src="assets/patrick-house-v2.glb"
  camera-controls
  auto-rotate
  auto-rotate-delay="0"
  rotation-per-second="20deg"
  camera-orbit="35deg 75deg 3m"
  field-of-view="30deg"
  shadow-intensity="1"
  environment-image="neutral"
  exposure="1"
  alt="派大星石头屋3D模型">
</model-viewer>
</body>
</html>
