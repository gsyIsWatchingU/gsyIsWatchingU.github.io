<!doctype html>
<!-- 此文件由 npm run build 生成，请修改 src 下的源码。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="海绵宝宝的三层菠萝屋：探索客厅、浴室、卧室、图书馆与屋顶花园。" />
    <meta name="theme-color" content="#b9dce3" />
    <meta name="robots" content="noindex" />
    <title>海绵宝宝的菠萝屋 · 三层剖面预览</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./styles/pineapple-house.css?v=20261009-final" />
  </head>
  <body>
    <main class="house" data-house-state="loading" aria-label="海绵宝宝的三层菠萝屋">
      <canvas data-house-canvas aria-label="拖动旋转菠萝屋，滚轮或双指缩放，点击房间进入近景" tabindex="0"></canvas>
      <header class="house-title">
        <p>比奇堡 · 三层剖面</p>
        <h1>海绵宝宝的菠萝屋</h1>
        <span class="review-note">建模预览 · 待审</span>
      </header>
      <div class="room-caption" data-house-caption hidden>
        <span data-house-floor></span><h2 data-house-room-name></h2>
        <button type="button" data-house-back aria-label="返回全屋剖面">← 返回全屋</button>
      </div>
      <div class="room-labels" data-house-labels aria-label="选择房间"></div>
      <div class="house-tooltip" data-house-tooltip hidden role="tooltip"></div>
      <section class="house-loading" data-house-loading role="status" aria-live="polite">
        <p data-house-load-text>正在载入菠萝屋</p>
        <progress data-house-progress max="100" value="0" aria-label="模型加载进度"></progress>
        <span data-house-load-count>0 / 13</span>
      </section>
      <section class="house-error" data-house-error hidden role="alert">
        <h2>部分模型未能载入</h2>
        <p data-house-error-message></p>
        <ul data-house-error-list></ul>
        <button type="button" data-house-retry>重新载入</button>
      </section>
      <p class="house-hint" data-house-hint>拖动观察 <i>·</i> 滚轮 / 双指缩放 <i>·</i> 点击房间进入近景</p>
      <noscript><p class="house-error">请开启 JavaScript，才能浏览三维菠萝屋。</p></noscript>
    </main>
    <script defer src="./assets/pineapple-house.js?v=20261009-review7"></script>
  </body>
</html>
