      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__deep-space" aria-hidden="true">
          <canvas class="galaxy-canvas"></canvas>
        </div>
        <div class="hero__danmaku" id="guestbook-sky" aria-hidden="true"></div>

        <div class="hero__copy reveal">
          <p class="eyebrow hero__role">
            <span></span>
            <strong>AI 全栈工程师</strong>
            <b aria-hidden="true">×</b>
            <strong>Agent 应用</strong>
          </p>
          <h1 id="hero-title">拥抱变化。</h1>
          <p class="hero__intro">
            华中科技大学电子信息硕士在读，<br />
            拥有字节跳动全栈研发、Agent 工程实习经历。<br />
            贯通产品交互、后端服务与可靠的 Agent Harness。
          </p>
          <div class="hero__actions">
            <a class="button button--dark magnetic" href="#projects">
              查看项目 <span aria-hidden="true">↘</span>
            </a>
            <button class="button button--light magnetic" id="guestbook-open" type="button">
              写一句留言 <span aria-hidden="true">＋</span>
            </button>
          </div>
        </div>

        <div class="hero__visual reveal" aria-hidden="true">
          <div class="signal-field">
            <canvas class="galaxy-focus-canvas"></canvas>
            <p class="signal-field__chapter">
              <span>拥抱变化 · 互动短片</span>
              <b>用光改变他看见的世界</b>
            </p>
            <div class="signal-field__status">
              <span><i></i> WORLD / SHIFTING</span>
              <b data-visitor-light>VISITOR TRACE · 00</b>
            </div>
            <p class="signal-field__event">
              <span data-story-kicker>故事开始 · 旧地图</span>
              <b data-story-copy>人群走同一条路，少年躲在队伍外</b>
            </p>
            <p class="signal-field__choices">
              <span data-choice-count>互动进度 0 / 3</span>
              <b data-world-name>工业 · 已知</b>
            </p>
            <div class="signal-field__worlds">
              <span data-world-option="nature">自然</span>
              <span data-world-option="industrial">工业</span>
              <span data-world-option="data">数据</span>
              <span data-world-option="future">未来</span>
            </div>
            <p class="signal-field__hint">
              <span data-story-instruction>① 移动光束，预览世界</span>
              <b data-story-action>② 点击光斑，留下 3 个变化</b>
            </p>
          </div>
        </div>
      </section>
