      <p class="guestbook__toast" id="guestbook-toast" role="status" aria-live="polite"></p>

      <dialog class="guestbook-dialog" id="guestbook-dialog" aria-labelledby="guestbook-dialog-title">
        <form class="guestbook-dialog__form" id="guestbook-form">
          <header class="guestbook-dialog__head">
            <div>
              <p>LEAVE A SIGNAL</p>
              <h3 id="guestbook-dialog-title">写下一句话</h3>
            </div>
            <button class="guestbook-dialog__close" id="guestbook-close" type="button" aria-label="关闭留言弹窗">×</button>
          </header>

          <label for="guestbook-nickname">怎么称呼你</label>
          <input
            id="guestbook-nickname"
            name="nickname"
            type="text"
            minlength="2"
            maxlength="20"
            autocomplete="nickname"
            placeholder="昵称"
            required
          />

          <fieldset class="guestbook-dialog__moods" id="guestbook-moods">
            <legend>现在的心情</legend>
            <label class="guestbook-mood is-selected">
              <input type="radio" name="mood" value="checkin" checked />
              <span class="guestbook-mood__name">打个卡就溜</span>
              <span class="guestbook-mood__hint">来都来了，留个脚印就走</span>
            </label>
            <label class="guestbook-mood">
              <input type="radio" name="mood" value="chat" />
              <span class="guestbook-mood__name">简单说两句</span>
              <span class="guestbook-mood__hint">想说的话，说给他听</span>
            </label>
            <label class="guestbook-mood">
              <input type="radio" name="mood" value="cold" />
              <span class="guestbook-mood__name">狠心冷漠</span>
              <span class="guestbook-mood__hint">一个字都不想打，走了</span>
            </label>
          </fieldset>

          <div class="guestbook-dialog__compose" id="guestbook-compose">
            <div class="guestbook-dialog__label-row">
              <label for="guestbook-content">留言</label>
              <span><span id="guestbook-character-count">0</span>/300</span>
            </div>
            <textarea
              id="guestbook-content"
              name="content"
              minlength="2"
              maxlength="300"
              rows="5"
              placeholder="建议、问题，或者一句路过的招呼。"
              required
            ></textarea>
            <p class="guestbook-dialog__compose-hint" id="guestbook-compose-hint" hidden>
              什么都不用写，这里会替你留一句打卡语。
            </p>
          </div>

          <div class="guestbook__honeypot" aria-hidden="true">
            <label for="guestbook-website">网站</label>
            <input id="guestbook-website" name="website" type="text" tabindex="-1" autocomplete="off" />
          </div>

          <p class="guestbook-dialog__status" id="guestbook-status" role="status" aria-live="polite"></p>
          <button class="guestbook-dialog__submit" id="guestbook-submit" type="submit" data-mood="checkin">
            <span class="guestbook-launch__copy">
              <span class="guestbook-launch__overline">LEAVE A SIGNAL</span>
              <span class="guestbook-launch__label" id="guestbook-submit-label">打个卡就溜</span>
            </span>
            <span class="guestbook-launch__scene" aria-hidden="true">
              <svg class="guestbook-launch__signal" viewBox="0 0 40 40" focusable="false">
                <circle class="guestbook-launch__signal-dot" cx="20" cy="20" r="4" />
                <path class="guestbook-launch__signal-arc" d="M12.5 13.8a11.5 11.5 0 0 1 0 12.4" />
                <path class="guestbook-launch__signal-arc" d="M8.8 10.2a17 17 0 0 1 0 19.6" />
              </svg>
            </span>
          </button>
        </form>
      </dialog>
