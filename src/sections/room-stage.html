    <header class="page-header">
      <a class="page-brand" href="#top" aria-label="返回房间顶部">
        <span class="page-brand__symbol" aria-hidden="true">
          <img src="./assets/gsy-logo-transparent-mark.png" alt="" />
        </span>
        <span class="page-brand__wordmark" aria-hidden="true">gsyIsWatchingU</span>
      </a>
      <p class="page-header__eyebrow">一个正在生长的小空间</p>
      <button type="button" class="page-header__mail" data-copy-email data-email="gsyiswatchingu@163.com" title="点击复制邮箱">gsyiswatchingu@163.com</button>
    </header>

    <main class="room-stage" id="top" aria-label="郭书羽的互动小屋">
      <div class="canvas-frame" data-room-view>
        <div class="room-scene" data-room3d-host>
          <canvas class="room-canvas" data-room-canvas aria-label="3D 互动小屋房间"></canvas>
          <div class="room-object__chip" data-room-chip role="tooltip" hidden></div>
        </div>

        <!-- 房间空气中的留言弹幕 -->
        <div class="room-air" data-room-air aria-hidden="true"></div>

        <!-- 房间氛围说明 -->
        <div class="room-hint" data-room-hint role="status" aria-live="polite">
          <span data-hint-text>点击或轻点物件，探索房间</span>
        </div>
      </div>

      <!-- 加载页 -->
      <div class="load-overlay" data-load-overlay role="status" aria-label="小屋加载中">
        <div class="load-card">
          <p class="load-card__eyebrow">GSY’S ROOM</p>
          <h1>正在准备小屋<span aria-hidden="true">…</span></h1>
          <div class="load-card__track" aria-hidden="true">
            <div class="load-card__bar" data-load-bar></div>
          </div>
          <p class="load-card__percent"><b data-load-percent>0</b>%</p>
          <p class="load-card__note">也可以先直接阅读作品。</p>
          <button class="load-card__skip" data-load-skip type="button">直接阅读作品</button>
        </div>
      </div>
    </main>

    <footer class="page-footer">
      <p>点击或轻点物件，探索房间<br /><span>拖动观察 · 滚轮或双指缩放 · 选择物件进入近景</span></p>
    </footer>
