<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="派大星的石头小屋：程序化构建的两层房屋、家具与角色互动。" />
    <meta name="theme-color" content="#b9dce3" />
    <title>gsyIsWatchingU · 派大星屋</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./styles/patrick-house.css?v=20261012-built6" />
  </head>
  <body>
    <main class="house" data-house-state="loading" data-house-view="whole" aria-label="派大星的石头小屋">
      <canvas data-house-canvas aria-label="拖动旋转小屋，滚轮或双指缩放，点击房间进入近景" tabindex="0"></canvas>
      <div class="house-title">
        <p>PATRICK'S ROCK</p>
        <h1>派大星的石头屋</h1>
      </div>
      <button type="button" class="mode-toggle" data-house-mode aria-pressed="false" aria-label="切换外观与剖面">外观</button>
      <div class="room-caption" data-house-caption hidden>
        <span data-house-floor></span><h2 data-house-room-name></h2>
        <button type="button" data-house-back aria-label="返回全屋剖面">← 返回全屋</button>
      </div>
      <div class="room-labels" data-house-labels aria-label="选择房间"></div>
      <div class="house-tooltip" data-house-tooltip hidden role="tooltip"></div>
      <section class="house-loading" data-house-loading role="status" aria-live="polite">
        <p>正在搭起石头小屋…</p>
        <progress max="100" value="100" aria-label="场景加载进度"></progress>
      </section>
      <section class="house-error" data-house-error hidden role="alert">
        <h2>无法显示三维小屋</h2>
        <p data-house-error-text>浏览器未能启用 WebGL。请检查硬件加速设置后刷新。</p>
        <button type="button" data-house-retry>重新载入</button>
      </section>
      <noscript><p class="house-error">请开启 JavaScript，才能浏览三维派大星屋。</p></noscript>
    </main>
    <script defer src="./assets/patrick-house.js?v=20261012-built6"></script>
  </body>
</html>
